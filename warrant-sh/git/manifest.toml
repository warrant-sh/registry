[manifest]
schema = "warrant.manifest.v1"
id = "warrant-sh/git"
tool = "git"
tool_version = ">=2.30"
manifest_version = "1.0.0"
summary = "Git capability map"
license = "CC0-1.0"
source = "https://github.com/git/git"

[transforms]
supported = ["literal", "path", "hostname", "email_domain", "glob", "git_remote"]

[tool_policy]
deny_flags = ["-c", "--no-verify", "--exec", "-x", "--global", "--system", "-f", "--file"]
strip_env = [
  "GIT_SSH",
  "GIT_SSH_COMMAND",
  "GIT_ASKPASS",
  "GIT_EDITOR",
  "GIT_EXEC_PATH",
  "GIT_CONFIG_GLOBAL",
  "GIT_CONFIG_SYSTEM",
  "GIT_CONFIG_PARAMETERS",
  "GIT_CONFIG_COUNT",
  "GIT_CONFIG_KEY_*",
  "GIT_CONFIG_VALUE_*",
]

[[commands]]
match = ["--help"]
capability = "git.help"
description = "Show CLI help and usage information"
risk = "low"
default = "allow"

[[commands]]
match = ["-h"]
capability = "git.help"
description = "Show CLI help and usage information"
risk = "low"
default = "allow"

[[commands]]
match = ["help"]
capability = "git.help"
description = "Show CLI help and usage information"
risk = "low"
default = "allow"

[[commands]]
match = ["--version"]
capability = "git.version"
description = "Show CLI version information"
risk = "low"
default = "allow"

[[commands]]
match = ["-V"]
capability = "git.version"
description = "Show CLI version information"
risk = "low"
default = "allow"

[[commands]]
match = ["version"]
capability = "git.version"
description = "Show CLI version information"
risk = "low"
default = "allow"

[[commands]]
match = ["clone"]
capability = "git.clone"
description = "Clone a remote repository to a local directory"
risk = "low"
default = "allow"
scope = { key = "repo", from = "arg", index = 1, transform = "git_remote" }
options = { branch = { names = ["-b", "--branch"], forms = ["separate", "equals", "attached"] } }
scope_examples = { repo = ["git@github.com:org/repo.git", "https://github.com/org/repo"], branch = ["main", "release/*"] }
scope_descriptions = { repo = "Repository URL to clone from", branch = "Which branch to check out" }

[[commands]]
match = ["fetch"]
capability = "git.fetch"
description = "Download objects and refs from a remote"
risk = "low"
default = "allow"
args = { remote = 1 }
scope_examples = { remote = ["origin", "upstream"] }
scope_descriptions = { remote = "Which remote to fetch from" }

[[commands]]
match = ["pull"]
capability = "git.pull"
description = "Fetch from and integrate with another repository or branch"
risk = "moderate"
default = "allow"
args = { remote = 1, branch = 2 }
scope_examples = { remote = ["origin", "upstream"], branch = ["main", "release/*"] }
scope_descriptions = { remote = "Which remote to pull from", branch = "Which branch to pull" }

[[commands]]
match = ["push"]
capability = "git.push"
label = "Push"
description = "Push local commits to a remote repository"
risk = "moderate"
default = "allow"
when_no_flags = ["--force", "-f", "--force-with-lease"]
args = { remote = 1, branch = 2 }
scope_examples = { remote = ["origin", "upstream"], branch = ["main", "release/*"] }
scope_descriptions = { remote = "Which remote to push to", branch = "Which branches can be pushed" }

[[commands]]
match = ["push"]
when_any_flags = ["--force", "-f", "--force-with-lease"]
capability = "git.push_force"
label = "Force Push"
description = "Rewrite remote history by force-pushing commits"
risk = "high"
default = "deny"

[[commands]]
match = ["checkout"]
capability = "git.checkout"
description = "Switch branches or restore working tree files"
risk = "low"
default = "allow"
args = { target = 1 }
scope_examples = { target = ["main", "feature/*", "HEAD~1"] }
scope_descriptions = { target = "Branch or ref to check out" }

[[commands]]
match = ["commit"]
capability = "git.commit"
description = "Record changes to the repository"
risk = "low"
default = "allow"

[[commands]]
match = ["branch"]
capability = "git.branch"
description = "List, create, or delete branches"
risk = "low"
default = "allow"

[[commands]]
match = ["merge"]
capability = "git.merge"
description = "Join two or more development histories together"
risk = "moderate"
default = "allow"
args = { target = 1 }
scope_examples = { target = ["main", "release/*"] }
scope_descriptions = { target = "Branch to merge into the current branch" }

[[commands]]
match = ["rebase"]
capability = "git.rebase"
description = "Reapply commits on top of another base"
risk = "moderate"
default = "allow"

[[commands]]
match = ["reset"]
capability = "git.reset"
description = "Reset HEAD to a specified state, potentially discarding work"
risk = "high"
default = "deny"

[[commands]]
match = ["stash"]
capability = "git.stash"
description = "Stash changes in the working directory"
risk = "low"
default = "allow"

[[commands]]
match = ["tag"]
capability = "git.tag"
description = "Create, list, or delete tags"
risk = "low"
default = "allow"

[[commands]]
match = ["remote"]
capability = "git.remote"
description = "Manage set of tracked remote repositories"
risk = "low"
default = "allow"

[[commands]]
match = ["remote", "add"]
capability = "git.remote_add"
description = "Add a new remote repository URL"
risk = "high"
default = "deny"

[[commands]]
match = ["remote", "set-url"]
capability = "git.remote_set_url"
description = "Change a remote repository URL"
risk = "high"
default = "deny"

[[commands]]
match = ["submodule", "add"]
capability = "git.submodule_add"
description = "Add a repository as a submodule"
risk = "high"
default = "deny"
scope = { key = "repo", from = "arg", index = 2, transform = "git_remote" }
args = { path = 3 }
scope_examples = { repo = ["git@github.com:org/repo.git", "https://github.com/org/repo"], path = ["vendor/lib", "submodules/dependency"] }
scope_descriptions = { repo = "Repository URL to add as a submodule", path = "Where to place the submodule" }

[[commands]]
match = ["config"]
when_any_flags = ["--global", "--system"]
capability = "git.config_global"
description = "Modify global or system git configuration"
risk = "high"
default = "deny"

[[commands]]
match = ["config"]
capability = "git.config"
description = "Read or write repository-local git configuration"
risk = "moderate"
default = "allow"

[[commands]]
match = ["log"]
capability = "git.log"
description = "Show commit history"
risk = "low"
default = "allow"

[[commands]]
match = ["diff"]
capability = "git.diff"
description = "Show changes between commits, working tree, etc."
risk = "low"
default = "allow"

[[commands]]
match = ["status"]
capability = "git.status"
description = "Show working tree status"
risk = "low"
default = "allow"

# --- Staging & working tree ---

[[commands]]
match = ["add"]
capability = "git.add"
description = "Stage file changes for commit"
risk = "low"
default = "allow"

[[commands]]
match = ["rm"]
capability = "git.rm"
description = "Remove files from the working tree and index"
risk = "low"
default = "allow"

[[commands]]
match = ["mv"]
capability = "git.mv"
description = "Move or rename a file or directory"
risk = "low"
default = "allow"

[[commands]]
match = ["restore"]
capability = "git.restore"
description = "Restore working tree files"
risk = "low"
default = "allow"

[[commands]]
match = ["clean"]
capability = "git.clean"
description = "Remove untracked files from the working tree"
risk = "moderate"
default = "deny"

# --- Branching & navigation ---

[[commands]]
match = ["switch"]
capability = "git.switch"
description = "Switch branches"
risk = "low"
default = "allow"

# --- Inspection & read-only ---

[[commands]]
match = ["show"]
capability = "git.show"
description = "Show various types of objects"
risk = "low"
default = "allow"

[[commands]]
match = ["blame"]
capability = "git.blame"
description = "Show what revision and author last modified each line"
risk = "low"
default = "allow"

[[commands]]
match = ["rev-parse"]
capability = "git.rev_parse"
description = "Parse revision or other git identifiers"
risk = "low"
default = "allow"

[[commands]]
match = ["ls-files"]
capability = "git.ls_files"
description = "Show information about files in the index and working tree"
risk = "low"
default = "allow"

[[commands]]
match = ["ls-tree"]
capability = "git.ls_tree"
description = "List the contents of a tree object"
risk = "low"
default = "allow"

[[commands]]
match = ["describe"]
capability = "git.describe"
description = "Give an object a human-readable name based on tags"
risk = "low"
default = "allow"

[[commands]]
match = ["shortlog"]
capability = "git.shortlog"
description = "Summarize git log output"
risk = "low"
default = "allow"

[[commands]]
match = ["grep"]
capability = "git.grep"
description = "Search tracked files for a pattern"
risk = "low"
default = "allow"

# --- History manipulation ---

[[commands]]
match = ["cherry-pick"]
capability = "git.cherry_pick"
description = "Apply changes from existing commits"
risk = "moderate"
default = "allow"

[[commands]]
match = ["revert"]
capability = "git.revert"
description = "Revert some existing commits"
risk = "moderate"
default = "allow"

# --- Patches ---

[[commands]]
match = ["apply"]
capability = "git.apply"
description = "Apply a patch to files"
risk = "moderate"
default = "allow"

[[commands]]
match = ["am"]
capability = "git.am"
description = "Apply patches from a mailbox"
risk = "moderate"
default = "allow"

[[commands]]
match = ["format-patch"]
capability = "git.format_patch"
description = "Prepare patches for email submission"
risk = "low"
default = "allow"

# --- Repository setup ---

[[commands]]
match = ["init"]
capability = "git.init"
description = "Create an empty git repository"
risk = "low"
default = "allow"

[[commands]]
match = ["worktree"]
capability = "git.worktree"
description = "Manage multiple working trees"
risk = "low"
default = "allow"

[[commands]]
match = []
capability = "git.other"
description = "Any other git subcommand not explicitly listed"
risk = "low"
default = "allow"
