default = "allow"

[[commands]]
match = ["pr", "comment"]
capability = "gh.pr_comment"
description = "Comment on a pull request"
risk = "moderate"
default = "allow"

[[commands]]
match = ["pr", "edit"]
capability = "gh.pr_edit"
description = "Edit a pull request"
risk = "moderate"
default = "allow"

