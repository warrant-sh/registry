risk = "low"
default = "allow"

[[commands]]
match = ["auth", "login"]
capability = "gh.auth_login"
description = "Log in to GitHub"
risk = "high"
default = "deny"

[[commands]]
match = ["auth", "logout"]
capability = "gh.auth_logout"
description = "Log out of GitHub"
risk = "high"
default = "deny"

[[commands]]
match = ["auth", "switch"]
