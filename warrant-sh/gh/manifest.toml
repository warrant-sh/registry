[manifest]
schema = "warrant.manifest.v1"
id = "warrant-sh/gh"
tool = "gh"
tool_version = "*"
manifest_version = "1.0.0"
summary = "GitHub CLI — PRs, issues, releases, Actions, API. Repo create/delete and auth changes denied."
license = "CC0-1.0"
source = "https://cli.github.com/"

[transforms]
supported = ["literal"]

# --- Help & version ---

[[commands]]
match = ["--help"]
capability = "gh.help"
description = "Show CLI help and usage information"
risk = "low"
default = "allow"

[[commands]]
match = ["-h"]
capability = "gh.help"
description = "Show CLI help and usage information"
risk = "low"
default = "allow"

[[commands]]
match = ["help"]
capability = "gh.help"
description = "Show CLI help and usage information"
risk = "low"
default = "allow"

[[commands]]
match = ["--version"]
capability = "gh.version"
description = "Show CLI version information"
risk = "low"
default = "allow"

# --- Pull requests (read) ---

[[commands]]
match = ["pr", "list"]
capability = "gh.pr_list"
description = "List pull requests"
risk = "low"
default = "allow"

[[commands]]
match = ["pr", "view"]
capability = "gh.pr_view"
description = "View a pull request"
risk = "low"
default = "allow"

[[commands]]
match = ["pr", "diff"]
capability = "gh.pr_diff"
description = "View pull request diff"
risk = "low"
default = "allow"

[[commands]]
match = ["pr", "checks"]
capability = "gh.pr_checks"
description = "View pull request checks"
risk = "low"
default = "allow"

[[commands]]
match = ["pr", "status"]
capability = "gh.pr_status"
description = "Show pull request status"
risk = "low"
default = "allow"

[[commands]]
match = ["pr", "checkout"]
capability = "gh.pr_checkout"
description = "Check out a pull request locally"
risk = "low"
default = "allow"

[[commands]]
match = ["pr", "review"]
capability = "gh.pr_review"
description = "Review a pull request"
risk = "low"
default = "allow"

